plugins {
    id 'java'
    id 'net.neoforged.moddev' version '2.0.148'
}

version = mod_version
group = mod_group_id

base {
    archivesName = "${mod_id}-${minecraft_version}"
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
}

sourceSets {
    // Dev-only verification harnesses (src/dev/java). They are compiled against
    // the mod but are not part of the production jar: the jar and the release
    // mod file come from the main source set.
    dev {
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
    }
}

repositories {
    maven { name = 'BMCLAPI'; url = uri('https://bmclapi2.bangbang93.com/maven/') }
    mavenCentral()

    // Test-only artifacts come from Maven Central exclusively. NeoForge's maven
    // is unreachable on some networks (DNS lands on an unrelated host and every
    // lookup stalls); without this, resolving JUnit first walks that repository
    // and the build hangs for minutes. Exclusive content keeps the game
    // dependency graph untouched.
    exclusiveContent {
        forRepository {
            maven { name = 'MavenCentralForTests'; url = uri('https://repo1.maven.org/maven2') }
        }
        filter {
            includeGroupByRegex 'org\\.junit.*'
            includeGroupByRegex 'org\\.opentest4j.*'
            includeGroupByRegex 'org\\.apiguardian.*'
        }
    }
}

dependencies {
    // MixinRuntime (modId `mr`) is optional and reached only through reflection
    // (hotadd/MixinRuntimeApi), so nothing here compiles against it: the jar is
    // placed in run/mods for dev and is not needed to build.

    // Plain JUnit tests, no game: language-file parity and failure-key coverage.
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
}

// `check` also compiles the dev harnesses (not shipped), so a change that only
// breaks src/dev still fails the build.
tasks.named('check') {
    dependsOn 'compileDevJava'
}

tasks.named('test') {
    useJUnitPlatform()
    testLogging {
        events 'passed', 'failed', 'skipped'
    }
}

def autoAddJar = providers.gradleProperty('autoAdd').orNull
def probeJar = providers.gradleProperty('probe').orNull
def verifyLan = providers.gradleProperty('verifyLan').orNull
def verifyRollback = providers.gradleProperty('verifyRollback').orNull
def failAfterModList = providers.gradleProperty('failAfterModList').orNull
def failAfterPack = providers.gradleProperty('failAfterPack').orNull
def verifyWatch = providers.gradleProperty('verifyWatch').orNull
def watchJar = providers.gradleProperty('watchJar').orNull
def watchExpectFailure = providers.gradleProperty('watchExpectFailure').orNull
def watchModId = providers.gradleProperty('watchModId').orNull
def verifyAddCommand = providers.gradleProperty('verifyAddCommand').orNull
def verifyDatapack = providers.gradleProperty('verifyDatapack').orNull
def verifyDatapackAtTitle = providers.gradleProperty('verifyDatapackAtTitle').orNull
def verifyGameplay = providers.gradleProperty('verifyGameplay').orNull
def verifyCompat = providers.gradleProperty('verifyCompat').orNull
def verifyMenu = providers.gradleProperty('verifyMenu').orNull
def verifyDelete = providers.gradleProperty('verifyDelete').orNull
def verifyRegistryProbe = providers.gradleProperty('verifyRegistryProbe').orNull
def verifyRegistryRefreeze = providers.gradleProperty('verifyRegistryRefreeze').orNull
def t4fixtureSelftest = providers.gradleProperty('t4fixtureSelftest').orNull
def t4fixtureSelftestRead = providers.gradleProperty('t4fixtureSelftestRead').orNull
def verifyPayload = providers.gradleProperty('verifyPayload').orNull
def verifyPayloadAfterJoin = providers.gradleProperty('verifyPayloadAfterJoin').orNull
def verifyPayloadRemote = providers.gradleProperty('verifyPayloadRemote').orNull
def verifyPayloadRemoteAddress = providers.gradleProperty('verifyPayloadRemoteAddress').orNull

neoForge {
    version = project.neo_version

    runs {
        client {
            client()
            if (autoAddJar) {
                systemProperty 'modreloader.autoAdd', autoAddJar
            }
            if (probeJar) {
                systemProperty 'modreloader.probe', probeJar
            }
            if (verifyLan) {
                systemProperty 'modreloader.verifyLan', 'true'
            }
            if (verifyRollback) {
                systemProperty 'modreloader.verifyRollback', 'true'
            }
            if (failAfterModList) {
                systemProperty 'modreloader.failAfterModList', 'true'
            }
            if (failAfterPack) {
                systemProperty 'modreloader.failAfterPack', 'true'
            }
            if (verifyWatch) {
                systemProperty 'modreloader.verifyWatch', 'true'
            }
            if (watchJar) {
                systemProperty 'modreloader.watchJar', watchJar
            }
            if (watchExpectFailure) {
                systemProperty 'modreloader.watchExpectFailure', 'true'
            }
            if (watchModId) {
                systemProperty 'modreloader.watchModId', watchModId
            }
            if (verifyPayload) {
                systemProperty 'modreloader.verifyPayload', verifyPayload
            }
            if (verifyPayloadAfterJoin) {
                systemProperty 'modreloader.verifyPayloadAfterJoin', 'true'
            }
            if (verifyPayloadRemote) {
                systemProperty 'modreloader.verifyPayloadRemote', verifyPayloadRemote
                systemProperty 'modreloader.remoteMarker', 'payload-received-remote.txt'
            }
            if (verifyPayloadRemoteAddress) {
                systemProperty 'modreloader.verifyPayloadRemoteAddress', verifyPayloadRemoteAddress
            }
            if (verifyDelete) {
                systemProperty 'modreloader.verifyDelete', 'true'
            }
            if (verifyRegistryProbe) {
                systemProperty 'modreloader.verifyRegistryProbe', 'true'
            }
            if (verifyRegistryRefreeze) {
                systemProperty 'modreloader.verifyRegistryRefreeze', 'true'
            }
            if (verifyMenu) {
                systemProperty 'modreloader.verifyMenu', 'true'
            }
            if (verifyAddCommand) {
                // In-world /modreloader add end-to-end check (creates a world).
                systemProperty 'modreloader.verifyAddCommand', verifyAddCommand
            }
            if (verifyDatapack) {
                // With verifyAddCommand: assert the hot-added mod's data/ became
                // live in the running world (recipes, loot tables, tags, craft).
                systemProperty 'modreloader.verifyDatapack', 'true'
            }
            if (verifyDatapackAtTitle) {
                // Same check, but the mod is hot-added at the title screen first:
                // the data pack has to be applied by the deferred world-start hook.
                systemProperty 'modreloader.verifyDatapackAtTitle', 'true'
            }
            if (providers.gradleProperty('verifyItemDecorators').orNull) {
                // With verifyAddCommand: the hot-added mod's
                // RegisterItemDecorationsEvent listener must have run (lookup grew
                // for the expected item).
                systemProperty 'modreloader.verifyItemDecorators', 'true'
            }
            if (providers.gradleProperty('verifyItemDecoratorItem').orNull) {
                systemProperty 'modreloader.verifyItemDecoratorItem',
                        providers.gradleProperty('verifyItemDecoratorItem').get()
            }
            if (providers.gradleProperty('verifyDatapackRemove').orNull) {
                // With verifyAddCommand/verifyDatapack: deselect the hot-added data
                // pack and reload, asserting recipes/loot return to the baseline.
                systemProperty 'modreloader.verifyDatapackRemove', 'true'
            }
            if (providers.gradleProperty('verifyGuiLayers').orNull) {
                // With verifyAddCommand: the hot-added mod's RegisterGuiLayersEvent
                // listener must have run (HUD layers present, order preserved,
                // 60 ticks rendered without crashing).
                systemProperty 'modreloader.verifyGuiLayers', 'true'
            }
            if (providers.gradleProperty('skipCapabilityReplay').orNull) {
                // A/B proof for the capability assertions: without the replay the
                // dogfood's barrel/crucible/machine providers must be missing.
                systemProperty 'modreloader.skipCapabilityReplay', 'true'
            }
            if (verifyGameplay) {
                // With verifyAddCommand: after the add, drive real gameplay on
                // the server (hammer/sieve/craft + the mod's own tables command).
                systemProperty 'modreloader.verifyGameplay', 'true'
            }
            if (providers.gradleProperty('verifyGameplayModId').orNull) {
                systemProperty 'modreloader.verifyGameplayModId',
                        providers.gradleProperty('verifyGameplayModId').get()
            }
            if (verifyCompat) {
                // Compatibility matrix: hot-add real jars at the title screen, one
                // at a time, and log a verdict per jar (comma-separated, deps first).
                systemProperty 'modreloader.verifyCompat', verifyCompat
            }
            if (providers.gradleProperty('verifyMixinLayout').orNull) {
                // Boundary check: an interface mixin against an already-loaded class
                // must be refused before anything is mutated.
                systemProperty 'modreloader.verifyMixinLayout',
                        providers.gradleProperty('verifyMixinLayout').get()
            }
            if (providers.gradleProperty('verifyMixinLayoutTarget').orNull) {
                systemProperty 'modreloader.verifyMixinLayoutTarget',
                        providers.gradleProperty('verifyMixinLayoutTarget').get()
            }
            if (providers.gradleProperty('verifyMpNotice').orNull) {
                // Client half: connect and assert the server's hot-add notice arrives
                // even though this client does not have the mod.
                systemProperty 'modreloader.verifyMpNotice', 'true'
            }
            if (providers.gradleProperty('mpNoticeAddress').orNull) {
                systemProperty 'modreloader.mpNoticeAddress',
                        providers.gradleProperty('mpNoticeAddress').get()
            }
            if (providers.gradleProperty('verifyMpRegistry').orNull) {
                // Multiplayer registry sync: connect, hot-add on the client, then
                // compare every id against the server's dump.
                systemProperty 'modreloader.verifyMpRegistry',
                        providers.gradleProperty('verifyMpRegistry').get()
            }
            if (providers.gradleProperty('mpRegistryAddress').orNull) {
                systemProperty 'modreloader.mpRegistryAddress',
                        providers.gradleProperty('mpRegistryAddress').get()
            }
            if (providers.gradleProperty('verifyCapabilities').orNull) {
                // Capability replay check: title-screen add -> create world -> place
                // barrel/crucible/machine -> look the capabilities up.
                systemProperty 'modreloader.verifyCapabilities',
                        providers.gradleProperty('verifyCapabilities').get()
            }
            if (providers.gradleProperty('verifyCapabilitiesModId').orNull) {
                systemProperty 'modreloader.verifyCapabilitiesModId',
                        providers.gradleProperty('verifyCapabilitiesModId').get()
            }
            if (providers.gradleProperty('verifyCreativeAtTitle').orNull) {
                // Title-screen hot-add, then create a world and check the mod's own
                // creative tab is registered, listed, selectable and renders.
                systemProperty 'modreloader.verifyCreativeAtTitle',
                        providers.gradleProperty('verifyCreativeAtTitle').get()
            }
            if (providers.gradleProperty('verifyCreativeAtTitleInstalled').orNull) {
                // Control case: the mod is already in mods/; skip the add.
                systemProperty 'modreloader.verifyCreativeAtTitleInstalled', 'true'
            }
            if (providers.gradleProperty('verifyCreativeAtTitleWarm').orNull) {
                // Same check after entering a world and opening the creative
                // inventory once (vanilla's tab-content cache is populated).
                systemProperty 'modreloader.verifyCreativeAtTitleWarm', 'true'
            }
            if (providers.gradleProperty('verifyCreativeAtTitleModId').orNull) {
                systemProperty 'modreloader.verifyCreativeAtTitleModId',
                        providers.gradleProperty('verifyCreativeAtTitleModId').get()
            }
            if (providers.gradleProperty('verifyRegAudit').orNull) {
                // Read-only registration audit: grade the mod-bus events each jar
                // registers against, and prove a known-crashing one is refused.
                systemProperty 'modreloader.verifyRegAudit',
                        providers.gradleProperty('verifyRegAudit').get()
            }
            if (providers.gradleProperty('verifyAtSpike').orNull) {
                // Read-only measurement: how many access-transformer target classes
                // are still unloaded at the title screen and in a world.
                systemProperty 'modreloader.verifyAtSpike',
                        providers.gradleProperty('verifyAtSpike').get()
            }
            if (providers.gradleProperty('verifyCreative').orNull) {
                // After the gameplay checks: switch to creative and render the
                // creative inventory (regression check for the tab-paging crash).
                systemProperty 'modreloader.verifyCreative', 'true'
            }
            if (providers.gradleProperty('verifyGameplayKeepOpen').orNull) {
                // Leave the world running after the automated gameplay checks so
                // the manual items (barrel/crucible/compost) can be played.
                systemProperty 'modreloader.verifyGameplayKeepOpen', 'true'
            }
            if (providers.gradleProperty('verifyAddCommandModId').orNull) {
                systemProperty 'modreloader.verifyAddCommandModId',
                        providers.gradleProperty('verifyAddCommandModId').get()
            }
            if (providers.gradleProperty('verifyAddCommandExpectFailure').orNull) {
                systemProperty 'modreloader.verifyAddCommandExpectFailure', 'true'
            }
            if (providers.gradleProperty('verifyAddCommandWatchJar').orNull) {
                // Second phase: drop this jar into the inbox while in world,
                // assert toast-only (no prompt screen).
                systemProperty 'modreloader.verifyAddCommandWatchJar',
                        providers.gradleProperty('verifyAddCommandWatchJar').get()
            }
        }
        server {
            server()
            // Server-side hot-add checks reuse the same properties as the client.
            if (autoAddJar) {
                systemProperty 'modreloader.autoAdd', autoAddJar
            }
            if (probeJar) {
                systemProperty 'modreloader.probe', probeJar
            }
            if (t4fixtureSelftest) {
                systemProperty 't4fixture.selftest', 'true'
            }
            if (t4fixtureSelftestRead) {
                systemProperty 't4fixture.selftest.read', 'true'
            }
            if (providers.gradleProperty('mpNoticeServer').orNull) {
                // Server half of the hot-add notice check: hot-add once a player is
                // connected, then the unmodified client must still be told about it.
                systemProperty 'modreloader.mpNoticeServer',
                        providers.gradleProperty('mpNoticeServer').get()
            }
            if (providers.gradleProperty('serverAddCommand').orNull) {
                // Console-path check: short-name /modreloader add + TAB completion
                // through the server's own command manager.
                systemProperty 'modreloader.serverAddCommand',
                        providers.gradleProperty('serverAddCommand').get()
            }
            if (providers.gradleProperty('mpRegistryServer').orNull) {
                // Server half of the multiplayer registry-sync check: hot-add once a
                // client says it is ready, then publish the authoritative ids.
                systemProperty 'modreloader.mpRegistryServer',
                        providers.gradleProperty('mpRegistryServer').get()
            }
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
            // Dev runs load the harnesses with the mod; release jars do not.
            sourceSet(sourceSets.dev)
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

// A1 needs JBR's enhanced class redefinition (mixin targets that add fields or
// interfaces cannot be redefined by a stock JVM). Both run tasks use it: the
// dedicated server has its own fei-tier hot-add path, and without the flag
// ZeroCore2's `Slot` redefine failed there while the same add succeeded on the
// client (status known issue 22).
def jbrJava = file("${System.getProperty('user.home')}/Library/Java/JavaVirtualMachines/jbr-21.jdk/Contents/Home/bin/java")

def useJbr = { JavaExec task ->
    if (jbrJava.exists()) {
        task.doFirst {
            executable = jbrJava.absolutePath
        }
        task.jvmArgs '-XX:+AllowEnhancedClassRedefinition'
    } else {
        task.logger.warn('JBR 21 not found at {}; {} runs on the toolchain JVM and ' +
                'fei-tier (mixin) hot-add will fail', jbrJava, task.name)
    }
}
tasks.named('runClient', JavaExec).configure { useJbr(it) }
tasks.named('runServer', JavaExec).configure { useJbr(it) }
